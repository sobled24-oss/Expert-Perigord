<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirection · Les Experts en Périgord</title>
<script>
/* Ancienne adresse des articles (article.html?type=jeu&id=…) : on renvoie vers la nouvelle page. */
(function(){
  var q = new URLSearchParams(location.search), id = q.get("id");
  var dossier = q.get("type") === "festival" ? "festivals" : "jeux";
  location.replace(id ? "/" + dossier + "/" + encodeURIComponent(id) + "/" : "/" + dossier + ".html");
})();
</script>
</head>
<body>
<p><a href="/">Les Experts en Périgord</a></p>
</body>
