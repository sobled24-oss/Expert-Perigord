nom: Les Experts en Périgord
intro: 'On joue aux jeux longs, denses et exigeants : ceux qui demandent une soirée entière et une vraie lecture de règles. On anime des tables en festival pour les faire découvrir, on teste les nouveautés, et on prépare notre propre événement en Périgord.'
criteres: |-
  Poids BoardGameGeek de 3,5 / 5 ou plus
  Parties de 2 à 6 heures
  Livrets de règles de 20 pages et plus
  Débutants bienvenus : on explique les règles
ville: Dordogne (24)
seances: 'À compléter : jour et horaires des séances'
