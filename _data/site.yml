nom: Les Experts en Périgord
intro: "On joue aux jeux longs, denses et exigeants : ceux qui demandent une
  soirée entière et une vraie lecture de règles. On anime des tables en festival
  pour les faire découvrir, on teste les nouveautés, bref nous voulons vous
  partager notre passion!"
criteres: >-
  Les jeux bien velus

  Rester 6h ou plus autour d'une table n'est pas un problème

  Les livres de règles epais comme le gros robert, on adore.

  Nous ne mangeons pas les débutants au petit déjeuner, nous adorons partager
  notre passion.
ville: Sud de la Dordogne (24)
seances: "À compléter : jour et horaires des séances"
goatcounter: experts-perigord
comptes_rendus: true
