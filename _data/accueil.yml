piliers:
  - titre: Jouer
    texte: Des parties longues et riches, à notre rythme, avec des joueurs qui
      aiment autant que vous les gros jeux.
  - titre: Apprendre
    texte: On explique les règles, même les plus épaisses. Débutants en jeux experts
      bienvenus.
  - titre: Partager
    texte: Nos tables en festival, nos avis sur les jeux et bientôt notre propre
      événement en Périgord.
histoire:
  titre: Quatre amis autour d'une table
  texte: >-
    nous nous retrouvons régulièrement et jouons 2 à 3 fois par semaine.

    Nous avons tous un penchant pour certaines mécaniques et univers de jeu mais
    nous partageons tous le plaisir de jouer a des jeux qui nous font réfléchir
    et passer un moment ensemble.
  signature: Les Experts
organisateurs:
  titre: Vous organisez un festival ?
  texte: "Nous venons animer une table de jeux experts : on apporte les jeux, on
    explique les règles et on accompagne les joueurs pendant toute la partie."
  bouton: Inviter les Experts
