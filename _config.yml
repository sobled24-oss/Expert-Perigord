# Site Les Experts en Périgord — construit automatiquement par GitHub Pages (Jekyll).
# Le contenu se modifie avec Pages CMS (https://app.pagescms.org), pas ici.
title: Les Experts en Périgord
url: https://jeu-experts-perigord.fr
lang: fr
markdown: kramdown
# Publier aussi les contenus datés dans le futur (les festivals à venir).
future: true
collections:
  jeux:
    output: true
    permalink: /jeux/:name/
  festivals:
    output: true
    permalink: /festivals/:name/
  strategies:
    output: true
    permalink: /strategie/:name/
defaults:
  - scope:
      type: jeux
    values:
      layout: article
  - scope:
      type: festivals
    values:
      layout: article
  - scope:
      type: strategies
    values:
      layout: guide
exclude:
  - MODE-D-EMPLOI.txt
  - README.md
  - scripts
