# Synchronise la page Ludothèque avec les collections BoardGameGeek des membres
# (jeux marqués « Je possède », comptes renseignés dans les fiches de l'équipe).
# Tourne chaque nuit, à la demande (onglet Actions > « Synchroniser la ludothèque »
# > Run workflow), et quand une fiche de l'équipe ou le réglage change.
name: Synchroniser la ludothèque

on:
  schedule:
    - cron: "17 3 * * *"   # chaque nuit vers 4 h 17 (heure de Paris en hiver)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_data/bgg.yml"
      - "_data/equipe.yml"
      - "scripts/sync_ludotheque.py"
      - "_festivals/**"

permissions:
  contents: write
  pages: write

concurrency:
  group: ludotheque
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow et PyYAML
        run: pip install --quiet pillow pyyaml

      - name: Récupérer les collections BoardGameGeek
        id: sync
        continue-on-error: true   # un compte en erreur n'empêche pas d'enregistrer les autres
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python scripts/sync_ludotheque.py

      - name: Enregistrer les changements
        id: commit
        run: |
          git add -A _data images
          if git diff --cached --quiet; then
            echo "Aucun changement dans la ludothèque."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Ludothèque (automatique)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Ludothèque : synchronisation avec BoardGameGeek"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruire le site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Le site se reconstruira au prochain enregistrement."

      - name: Signaler un compte en erreur
        if: steps.sync.outcome == 'failure'
        run: |
          echo "Au moins un compte BoardGameGeek n'a pas pu être lu : voir le détail de l'étape « Récupérer les collections BoardGameGeek »."
          exit 1
